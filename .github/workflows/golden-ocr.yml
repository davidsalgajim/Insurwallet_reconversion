name: Golden OCR

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/golden-ocr.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/golden-ocr.yml'

jobs:
  golden-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install worker dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Golden set — critical fields >= 95%
        working-directory: worker
        run: pytest tests/test_golden.py -v --tb=short

      - name: Worker unit tests
        working-directory: worker
        run: pytest tests/ -v --tb=short --ignore=tests/test_claude_extractor.py
