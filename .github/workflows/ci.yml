name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Firestore & Storage rules tests (emulators)
        run: npm run emulators:exec -- "npm run test:rules && npm run test:storage-rules"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-insurwallet.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-insurwallet
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-insurwallet.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789012:web:abcdef123456'
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'false'
          NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION: 'false'
