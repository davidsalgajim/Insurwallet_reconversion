name: E2E

on:
  pull_request:
  workflow_dispatch:

# Skeleton gate — allow failures while preview deploy + emulator wiring matures (task 6.3).
jobs:
  playwright:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-insurwallet.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-insurwallet
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-insurwallet.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789012:web:abcdef123456'
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'false'
          NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION: 'false'

      - name: Run Playwright smoke tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_PORT: '3000'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
