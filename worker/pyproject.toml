[project]
name = "insurwallet-worker"
version = "0.1.0"
description = "InsurWallet document processing pipeline (Cloud Run)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.49.0",
  "fastapi>=0.115.0",
  "google-cloud-storage>=2.19.0",
  "markitdown>=0.1.1",
  "pdfplumber>=0.11.0",
  "pydantic>=2.10.0",
  "pymupdf>=1.25.0",
  "pypdf>=5.4.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
